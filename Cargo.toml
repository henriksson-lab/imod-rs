[workspace]
members = [".", "gui/*"]

[package]
name = "imod-rs"
version = "0.0.0"
edition = "2024"
license = "GPL-2.0-only"
publish = false

[lib]
path = "src/lib.rs"

[features]
default = ["qt"]
# Enables the direct C++/Qt QImage boundary used by mrc2tif JPEG/PNG output.
# The workspace builds `mrc2tif_qimage_save` against the system Qt installation.
qt = []
# Default-off Rust-native experimental backends.  They are selected at runtime
# only when the matching IMOD_RS_*_BACKEND environment variable requests them.
rust-tiff = ["dep:tiff"]
rust-image-encoder = ["dep:image", "dep:png"]
rustfft-backend = ["dep:rustfft", "dep:num-complex"]
rust-native-backends = ["rust-tiff", "rust-image-encoder", "rustfft-backend"]
# Enables the Slint presentation mapping of eTomo's MainFrame.  The command
# launcher is separate from `etomo` until UIHarness/manager callbacks are
# translated from `IMOD/Etomo/src/etomo/ui/swing`.
gui = ["dep:etomo-ui-main-window", "dep:slint"]
# Native OpenGL event/context driver for the `IMOD/3dmod/mv_window.cpp`
# translation.  Kept opt-in while the 3dmod rendering closure lands.
three-dmod-gl = ["dep:winit", "dep:glutin", "dep:glutin-winit", "dep:glow", "dep:raw-window-handle"]

[dependencies]
libc = "0.2"
regex = "1"
tiff = { version = "0.11", optional = true }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"], optional = true }
png = { version = "0.18", optional = true }
rustfft = { version = "6.2", optional = true }
num-complex = { version = "0.4", optional = true }
etomo-ui-main-window = { path = "gui/etomo-ui-main-window", optional = true }
slint = { version = "1.17", optional = true }
winit = { version = "0.30.13", optional = true }
glutin = { version = "0.32.3", optional = true }
glutin-winit = { version = "0.5.0", optional = true }
glow = { version = "0.17.0", optional = true }
raw-window-handle = { version = "0.6", optional = true }

[[bin]]
name = "newstack"
path = "src/bin/newstack.rs"

[[bin]]
name = "header"
path = "src/bin/header.rs"

[[bin]]
name = "binvol"
path = "src/bin/binvol.rs"

[[bin]]
name = "alterheader"
path = "src/bin/alterheader.rs"

[[bin]]
name = "clip"
path = "src/bin/clip.rs"

[[bin]]
name = "tif2mrc"
path = "src/bin/tif2mrc.rs"

[[bin]]
name = "mrc2tif"
path = "src/bin/mrc2tif.rs"

[[bin]]
name = "3dmod"
path = "src/bin/3dmod.rs"

[[bin]]
name = "midas"
path = "src/bin/midas.rs"

[[bin]]
name = "imodinfo"
path = "src/bin/imodinfo.rs"

[[bin]]
name = "imodjoin"
path = "src/bin/imodjoin.rs"

[[bin]]
name = "wmod2imod"
path = "src/bin/wmod2imod.rs"

[[bin]]
name = "convertmod"
path = "src/bin/convertmod.rs"

[[bin]]
name = "trimvol"
path = "src/bin/trimvol.rs"

[[bin]]
name = "submfg"
path = "src/bin/submfg.rs"

[[bin]]
name = "subm"
path = "src/bin/subm.rs"

[[bin]]
name = "batchruntomo"
path = "src/bin/batchruntomo.rs"

[[bin]]
name = "etomo"
path = "src/bin/etomo.rs"

[[bin]]
name = "processchunks"
path = "src/bin/processchunks.rs"

[[bin]]
name = "imodqtassist"
path = "src/bin/imodqtassist.rs"

[[bin]]
name = "imodsendevent"
